name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  storefront:
    name: Storefront (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-users
          NEXT_PUBLIC_SITE_URL: https://example.invalid
  adminnew:
    name: Admin (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminnew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adminnew/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-users
  e2e:
    name: Bout en bout (navigateur, PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mybigmarket
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: mybigmarket
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U mybigmarket"
          --health-interval 5s --health-timeout 5s --health-retries 12
    # Valeurs propres à cette base éphémère de CI : aucune ne sert ailleurs.
    env:
      DATABASE_URL: postgres://mybigmarket:ci-only-password@localhost:5432/mybigmarket
      AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-users
      AUTH_TRUST_HOST: "true"
      ALLOW_MOCK_PAYMENTS: "true"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      ADMIN_API_BASE_URL: http://localhost:3000
      SEED_SUPERADMIN_EMAIL: admin-e2e@mybigmarket.test
      SEED_SUPERADMIN_PASSWORD: ci-only-admin-password-2026
      SEED_DEMO_PASSWORD: ci-only-demo-password
      E2E_ADMIN_EMAIL: admin-e2e@mybigmarket.test
      E2E_ADMIN_PASSWORD: ci-only-admin-password-2026
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            adminnew/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: adminnew
      - name: Base de données (migrations, administrateur, démonstration)
        run: |
          npx drizzle-kit migrate
          npm run db:seed:admin
          npm run db:seed:demo
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/e2e-prepare.sql
      - name: Builds de production
        run: |
          npm run build
          (cd adminnew && npm run build)
      - name: Démarrage de la boutique et du back-office
        run: |
          nohup npx next start -p 3000 > storefront.log 2>&1 &
          (cd adminnew && nohup npx next start -p 3002 > ../admin.log 2>&1 &)
          # Attente : le serveur répond (200 pour la boutique, redirection vers /login pour le back-office).
          for port in 3000 3002; do
            timeout 90 bash -c "until [ \"\$(curl -s -o /dev/null -w '%{http_code}' http://localhost:$port/)\" != 000 ]; do sleep 1; done"
          done
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-rapport
          path: |
            playwright-report
            test-results
            storefront.log
            admin.log
          retention-days: 7
