name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  storefront:
    name: Storefront (lint, types, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx drizzle-kit check
      - run: npm test
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-users
          NEXT_PUBLIC_SITE_URL: https://example.invalid
  adminnew:
    name: Admin (lint, types, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: adminnew
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: adminnew/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          AUTH_SECRET: ci-only-secret-that-is-not-used-for-real-users
